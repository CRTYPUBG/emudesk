# EmuDesk development / self-hosted stack.
# Docker is optional — the same components run with plain `cargo run`.
#
#   docker compose up --build
#
services:
  signal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # TLS signalling (clients dial this)
      - "5876:5876"
      # Plain-HTTP health check
      - "8080:8080"
    environment:
      PORT: "5876"
      HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped