[workspace]
resolver = "2"
members = ["emudesk-core", "emudesk-server", "emudesk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EmuDesk"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.40", features = ["full"] }

# Testing
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"